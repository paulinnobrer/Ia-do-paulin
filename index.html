<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IA do Paulin — Gerador de Sites</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#05070d;color:#fff}
header{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #17243a;position:sticky;top:0;background:#05070df2;z-index:10}
.logo{font-size:24px;font-weight:800}.logo span{color:#1683ff}
.status{font-size:12px;color:#45ff9a}
.container{width:92%;max-width:1100px;margin:35px auto}
.hero{text-align:center;margin-bottom:30px}
.hero h1{font-size:clamp(34px,7vw,60px);margin-bottom:10px}
.hero h1 span{color:#1683ff}
.hero p{color:#9aa7bb}
.card{background:#0b101b;border:1px solid #1b2d48;border-radius:18px;padding:24px;margin-bottom:20px}
.card h2{margin-bottom:20px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.field label{display:block;font-size:14px;font-weight:bold;margin-bottom:7px}
input,textarea,select{width:100%;background:#050912;color:#fff;border:1px solid #263957;border-radius:9px;padding:13px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#1683ff}
textarea{min-height:110px;resize:vertical}
.full{grid-column:1/-1}
.upload{border:2px dashed #28517e;border-radius:12px;padding:25px;text-align:center;cursor:pointer;color:#91a0b6}
.upload:hover{border-color:#1683ff}
.upload input{display:none}
.preview-images{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
.preview-images img{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid #294466}
.actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
button{border:0;border-radius:10px;padding:14px;font-weight:bold;cursor:pointer;font-size:15px}
.primary{background:#1683ff;color:#fff}
.secondary{background:#172238;color:#fff}
.danger{background:#27141a;color:#ff8290}
button:hover{filter:brightness(1.12)}
.item{border:1px solid #1e304a;border-radius:12px;padding:15px;margin-bottom:12px}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.site-preview{display:none;background:#fff;color:#111;border-radius:15px;overflow:hidden}
.site-preview iframe{width:100%;height:650px;border:0}
.generated{display:none}
pre{background:#03050a;color:#a9d2ff;padding:15px;border-radius:10px;overflow:auto;max-height:400px;white-space:pre-wrap;font-size:12px}
@media(max-width:700px){
.grid{grid-template-columns:1fr}.full{grid-column:auto}
.actions{grid-template-columns:1fr}
header{padding:15px 4%}
.container{width:94%}
}
</style>
</head>

<body>

<header>
  <div class="logo">IA <span>do Paulin</span></div>
  <div class="status">● SISTEMA ONLINE</div>
</header>

<div class="container">

<section class="hero">
<h1>Crie sites com <span>IA</span></h1>
<p>Monte sites profissionais para seus clientes em poucos minutos.</p>
</section>

<div class="card">
<h2>🏢 Informações do negócio</h2>

<div class="grid">

<div class="field">
<label>Nome do negócio</label>
<input id="nome" placeholder="Ex: Barbearia do João">
</div>

<div class="field">
<label>Tipo de negócio</label>
<select id="tipo">
<option>Empresa</option>
<option>Barbearia</option>
<option>Restaurante</option>
<option>Loja</option>
<option>Salão de beleza</option>
<option>Clínica</option>
<option>Profissional autônomo</option>
<option>Portfólio</option>
<option>Landing Page</option>
</select>
</div>

<div class="field full">
<label>Descrição</label>
<textarea id="descricao" placeholder="Explique o negócio e o que o site deve apresentar..."></textarea>
</div>

<div class="field">
<label>WhatsApp</label>
<input id="whatsapp" placeholder="Ex: 5585999999999">
</div>

<div class="field">
<label>Instagram</label>
<input id="instagram" placeholder="@empresa">
</div>

<div class="field">
<label>Endereço</label>
<input id="endereco" placeholder="Rua, número, cidade">
</div>

<div class="field">
<label>Horário</label>
<input id="horario" placeholder="Seg-Sáb: 08h às 18h">
</div>

</div>
</div>

<div class="card">
<h2>🎨 Identidade visual</h2>

<div class="grid">

<div class="field">
<label>Cor principal</label>
<input id="cor" type="color" value="#1683ff">
</div>

<div class="field">
<label>Estilo</label>
<select id="estilo">
<option>Moderno</option>
<option>Elegante</option>
<option>Minimalista</option>
<option>Luxuoso</option>
<option>Profissional</option>
<option>Jovem</option>
</select>
</div>

</div>
</div>

<div class="card">
<h2>🖼️ Logo</h2>

<label class="upload">
Clique para adicionar a logo
<input id="logo" type="file" accept="image/*">
</label>

<div id="logoPreview" class="preview-images"></div>
</div>

<div class="card">
<h2>📸 Fotos do negócio</h2>

<label class="upload">
Clique para adicionar várias fotos
<input id="fotos" type="file" accept="image/*" multiple>
</label>

<div id="fotosPreview" class="preview-images"></div>
</div>

<div class="card">
<h2>🛍️ Produtos / Serviços</h2>

<div id="items"></div>

<button class="secondary" onclick="addItem()">+ Adicionar produto ou serviço</button>
</div>

<div class="card">
<h2>⭐ Depoimentos</h2>

<textarea id="depoimentos" placeholder="Ex: Atendimento excelente! — João"></textarea>
</div>

<div class="card">
<div class="actions">
<button class="primary" onclick="gerarSite()">✨ GERAR SITE COM IA</button>
<button class="secondary" onclick="mostrarCodigo()">💻 CÓDIGO</button>
<button class="secondary" onclick="baixarSite()">⬇️ BAIXAR</button>
</div>
</div>

<div class="card site-preview" id="previewBox">
<h2 style="padding:20px;color:#111">👁️ Pré-visualização</h2>
<iframe id="preview"></iframe>
</div>

<div class="card generated" id="codigoBox">
<h2>💻 Código do site</h2>
<pre id="codigo"></pre>
</div>

</div>

<script>

let logoData="";
let fotosData=[];
let itens=[];

function readImage(file,callback){
 const reader=new FileReader();
 reader.onload=e=>callback(e.target.result);
 reader.readAsDataURL(file);
}

document.getElementById("logo").addEventListener("change",function(){
 const file=this.files[0];
 if(!file)return;
 readImage(file,data=>{
   logoData=data;
   document.getElementById("logoPreview").innerHTML=
   `<img src="${data}">`;
 });
});

document.getElementById("fotos").addEventListener("change",function(){
 fotosData=[];
 document.getElementById("fotosPreview").innerHTML="";
 [...this.files].forEach(file=>{
   readImage(file,data=>{
     fotosData.push(data);
     document.getElementById("fotosPreview").innerHTML+=
     `<img src="${data}">`;
   });
 });
});

function addItem(){
 const id=Date.now();
 itens.push(id);

 const div=document.createElement("div");
 div.className="item";
 div.id="item-"+id;

 div.innerHTML=`
 <div class="item-head">
 <strong>Produto / Serviço</strong>
 <button class="danger" onclick="removeItem(${id})">Remover</button>
 </div>
 <div class="grid">
 <input class="item-name" placeholder="Nome">
 <input class="item-price" placeholder="Preço">
 <textarea class="item-desc full" placeholder="Descrição"></textarea>
 </div>
 `;

 document.getElementById("items").appendChild(div);
}

function removeItem(id){
 document.getElementById("item-"+id)?.remove();
 itens=itens.filter(x=>x!==id);
}

function getItems(){
 return [...document.querySelectorAll(".item")].map(item=>({
   nome:item.querySelector(".item-name").value,
   preco:item.querySelector(".item-price").value,
   descricao:item.querySelector(".item-desc").value
 }));
}

function gerarSite(){

 const nome=document.getElementById("nome").value || "Meu Negócio";
 const tipo=document.getElementById("tipo").value;
 const descricao=document.getElementById("descricao").value;
 const whatsapp=document.getElementById("whatsapp").value;
 const instagram=document.getElementById("instagram").value;
 const endereco=document.getElementById("endereco").value;
 const horario=document.getElementById("horario").value;
 const cor=document.getElementById("cor").value;
 const estilo=document.getElementById("estilo").value;
 const depoimentos=document.getElementById("depoimentos").value;

 const produtos=getItems();

 let cards=produtos.map(p=>`
 <div class="produto">
 <h3>${p.nome||"Serviço"}</h3>
 <p>${p.descricao||""}</p>
 <strong>${p.preco||""}</strong>
 </div>
 `).join("");

 let fotos=fotosData.map(f=>`
 <img src="${f}">
 `).join("");

 let contato=whatsapp
 ? `<a class="btn" href="https://wa.me/${whatsapp}" target="_blank">Falar no WhatsApp</a>`
 : "";

 let logo=logoData
 ? `<img class="logoImg" src="${logoData}">`
 : "";

 const site=`
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>${nome}</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#151a24}
header{background:${cor};color:white;padding:25px;text-align:center}
.logoImg{max-width:100px;max-height:80px;border-radius:10px}
nav{padding:15px;text-align:center;background:#111;color:white}
nav a{color:white;margin:0 10px;text-decoration:none}
.hero{padding:80px 20px;text-align:center;background:linear-gradient(135deg,${cor},#111)}
.hero h1{font-size:45px;color:white}
.hero p{color:white;max-width:700px;margin:auto;font-size:18px}
.btn{display:inline-block;background:${cor};color:white;padding:14px 22px;border-radius:8px;text-decoration:none;margin-top:20px}
section{padding:55px 7%}
.gridSite{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.produto{background:white;padding:25px;border-radius:15px;box-shadow:0 5px 20px #0001}
.produto strong{color:${cor};font-size:20px}
.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.galeria img{width:100%;height:220px;object-fit:cover;border-radius:12px}
.info{background:#111;color:white;text-align:center}
footer{padding:30px;background:#050505;color:#aaa;text-align:center}
</style>
</head>

<body>

<header>
${logo}
<h1>${nome}</h1>
<p>${tipo}</p>
</header>

<nav>
<a href="#sobre">Sobre</a>
<a href="#servicos">Serviços</a>
<a href="#fotos">Fotos</a>
<a href="#contato">Contato</a>
</nav>

<section class="hero">
<h1>${nome}</h1>
<p>${descricao}</p>
${contato}
</section>

<section id="sobre">
<h2>Sobre nós</h2>
<p>${descricao}</p>
</section>

<section id="servicos">
<h2>Produtos e Serviços</h2>
<div class="gridSite">${cards}</div>
</section>

${fotos ? `
<section id="fotos">
<h2>Galeria</h2>
<div class="galeria">${fotos}</div>
</section>
` : ""}

<section class="info" id="contato">
<h2>Entre em contato</h2>
<p>${endereco}</p>
<p>${horario}</p>
<p>${instagram}</p>
${contato}
</section>

<section>
<h2>⭐ O que nossos clientes dizem</h2>
<p>${depoimentos}</p>
</section>

<footer>
© ${new Date().getFullYear()} ${nome} — Site criado pela IA do Paulin
</footer>

</body>
</html>
`;

 document.getElementById("preview").srcdoc=site;
 document.getElementById("codigo").textContent=site;

 window.siteGerado=site;

 document.getElementById("previewBox").style.display="block";

 document.getElementById("previewBox").scrollIntoView({
   behavior:"smooth"
 });
}

function mostrarCodigo(){
 if(!window.siteGerado){
   alert("Primeiro clique em GERAR SITE COM IA.");
   return;
 }

 document.getElementById("codigoBox").style.display="block";
 document.getElementById("codigoBox").scrollIntoView({
   behavior:"smooth"
 });
}

function baixarSite(){

 if(!window.siteGerado){
   alert("Primeiro gere o site.");
   return;
 }

 const blob=new Blob([window.siteGerado],{
   type:"text/html"
 });

 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");

 a.href=url;
 a.download="site-gerado.html";
 a.click();

 URL.revokeObjectURL(url);
}

addItem();

</script>

</body>
</html>
